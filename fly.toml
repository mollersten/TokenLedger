# Fly.io deployment. Deploy with `fly deploy` from backend/.
#
# DATABASE_URL (Supabase session pooler) is a Fly secret, not set here.
# The server applies pending migrations when it starts.
#
# Keep ONE machine: the Supabase session pooler allows 15 connections and the
# server opens up to DATABASE_MAX_CONNECTIONS (10). With one machine a deploy
# stops the old server before the new one starts, which a migration that
# drops a column needs. Before adding machines, lower
# DATABASE_MAX_CONNECTIONS so all of them fit under 15.

app = "tokenledger-api"
primary_region = "lhr" # London, next to Supabase in eu-west-1 (Ireland)
kill_signal = "SIGTERM"
kill_timeout = "30s" # in-flight requests finish, then usage counts are flushed

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDR = "0.0.0.0:8080"
  RUST_LOG = "info"
  DATABASE_MAX_CONNECTIONS = "10"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the reaper, usage flusher and pruner run in the background.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Liveness only: a Supabase hiccup must not restart the machine.
  # /healthz checks the database.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/livez"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
